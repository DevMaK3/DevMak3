<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 60" width="100%" height="100%">
  <defs>
    <!-- Teal Gradient (Left Arrow) -->
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#004D40"/>
      <stop offset="50%" stop-color="#01796F"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>

    <!-- Center Arrow Glow Gradient -->
    <linearGradient id="centerGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#01796F"/>
      <stop offset="60%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#E0F7FA"/>
    </linearGradient>

    <!-- Steel Blue / Silver Gradient (Right Arrow) -->
    <linearGradient id="silverGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#B0C4DE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Text Metallic Gradient -->
    <linearGradient id="textDevGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B0C4DE"/>
    </linearGradient>

    <!-- Text Teal Glow Gradient -->
    <linearGradient id="textMakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#01796F"/>
    </linearGradient>

    <!-- Subtle 3D Shadow -->
    <filter id="glow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00F5D4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- DevMaK3 Geometric 3D Arrow Emblem -->
  <g transform="translate(6, 4) scale(0.52)" filter="url(#glow3d)">
    <!-- Left Teal Arrow -->
    <path d="M22 84 L22 38 L10 50 L32 16 L54 50 L42 38 L42 84 Z" fill="url(#tealGrad)" stroke="#00F5D4" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Center Hero Arrow (Taller) -->
    <path d="M46 78 L46 30 L34 42 L56 8 L78 42 L66 30 L66 78 Z" fill="url(#centerGrad)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Right Steel Blue Arrow -->
    <path d="M70 72 L70 36 L58 48 L80 20 L102 48 L90 36 L90 72 Z" fill="url(#silverGrad)" stroke="#E2E8F0" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Central Pivot Glint -->
    <circle cx="56" cy="74" r="3" fill="#00F5D4" opacity="0.9"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(68, 32)">
    <!-- DevMaK3 Title -->
    <text x="0" y="0" font-family="'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5px">
      <tspan fill="url(#textDevGrad)">Dev</tspan><tspan fill="url(#textMakGrad)">MaK3</tspan>
    </text>

    <!-- Official Brand Slogan (Long Logo Feature) -->
    <text x="1" y="16" font-family="'JetBrains Mono', 'Inter', monospace" font-size="8.5" font-weight="500" fill="#6D8196" letter-spacing="1.2px">
      MAKE YOUR IDEAS, DEVELOP YOUR DREAMS
    </text>
  </g>
</svg>
